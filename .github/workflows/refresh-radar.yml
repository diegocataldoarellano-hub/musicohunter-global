name: Fast global radar refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9,21 * * *"

permissions:
  contents: read

concurrency:
  group: fast-global-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RADAR_API_BASE_URL: ${{ secrets.RADAR_API_BASE_URL }}
      RADAR_ADMIN_TOKEN: ${{ secrets.RADAR_ADMIN_TOKEN }}
    steps:
      - name: Preflight configuration
        id: preflight
        run: |
          if [ -z "$RADAR_API_BASE_URL" ] || [ -z "$RADAR_ADMIN_TOKEN" ]; then
            {
              echo "## Fast global radar refresh"
              echo ""
              echo "Skipped: repository secrets are not configured yet."
              echo ""
              echo "Add these GitHub repository secrets to enable the automatic refresh:"
              echo ""
              echo "- \`RADAR_API_BASE_URL\`: public Render API URL"
              echo "- \`RADAR_ADMIN_TOKEN\`: same \`ADMIN_TOKEN\` configured in Render"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Warm up backend
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          base_url = os.environ["RADAR_API_BASE_URL"].rstrip("/")
          health_url = f"{base_url}/api/health"
          last_error = None
          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(health_url, timeout=25) as response:
                      if 200 <= response.status < 500:
                          print(f"Backend responded with HTTP {response.status} on attempt {attempt}")
                          break
              except Exception as exc:
                  last_error = exc
                  print(f"Backend warm-up attempt {attempt} failed: {exc}")
                  time.sleep(min(10 * attempt, 45))
          else:
              raise SystemExit(f"Backend did not respond after warm-up attempts: {last_error}")
          PY

      - name: Run fast global refresh
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 900 \
            -X POST "$RADAR_API_BASE_URL/api/admin/refresh-fast" \
            -H "x-admin-token: $RADAR_ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -o refresh-result.json

      - name: Check links after refresh
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 540 \
            -X POST "$RADAR_API_BASE_URL/api/admin/check-links" \
            -H "x-admin-token: $RADAR_ADMIN_TOKEN" \
            -H "content-type: application/json" \
            -o link-check-result.json

      - name: Publish run summary
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          refresh = json.loads(Path("refresh-result.json").read_text())
          links = json.loads(Path("link-check-result.json").read_text())
          lines = [
              "## Fast global radar refresh",
              "",
              f"- Countries scanned: {refresh.get('countries_scanned', 'n/a')}",
              f"- Queries per country: {refresh.get('queries_per_country', 'n/a')}",
              f"- Sources added: {refresh.get('added', {}).get('sources', 0)}",
              f"- Opportunities added: {refresh.get('added', {}).get('opportunities', 0)}",
              f"- Candidate pages reviewed: {refresh.get('reviewed', 0)}",
              f"- Link status counts: {links.get('counts', {})}",
              f"- Errors: {len(refresh.get('errors', []))}",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines), encoding="utf-8")
          PY
