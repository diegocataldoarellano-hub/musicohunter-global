databases:
  - name: music-hunter-db
    plan: free
    databaseName: music_hunter
    user: music_hunter

services:
  - type: web
    name: music-hunter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-hunter-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPEN_MODEL_BASE_URL
        sync: false
      - key: OPEN_MODEL_API_KEY
        sync: false
      - key: OPEN_MODEL_NAME
        value: mistralai/Mistral-7B-Instruct-v0.3
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: DISCOVERY_COUNTRY_LIMIT
        value: "260"
      - key: DISCOVERY_QUERIES_PER_COUNTRY
        value: "48"
      - key: DISCOVERY_RESULTS_PER_QUERY
        value: "5"

  - type: cron
    name: music-hunter-daily-curator
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.curator_agent
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-hunter-db
          property: connectionString
      - key: OPEN_MODEL_BASE_URL
        sync: false
      - key: OPEN_MODEL_API_KEY
        sync: false
      - key: OPEN_MODEL_NAME
        value: mistralai/Mistral-7B-Instruct-v0.3
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: DISCOVERY_COUNTRY_LIMIT
        value: "260"
      - key: DISCOVERY_QUERIES_PER_COUNTRY
        value: "48"
      - key: DISCOVERY_RESULTS_PER_QUERY
        value: "5"
